# The verification gate for `dev`, plus a convention-compliant PREFLIGHT.
#
# Two routes, one gate:
#   * push to `dev`         — DETECTION on the pushed tip. The baseline is the
#                             event's own `before`, so the platform supplies it.
#   * push to `scratch/**`  — PREFLIGHT on the candidate, before it is
#                             fast-forwarded. The baseline is the exact fetched
#                             `refs/remotes/origin/dev` commit, and the gate
#                             proves the candidate descends from it.
#
# There is deliberately NO `pull_request` trigger: this repo integrates by
# fast-forward push and never by PR, and a PR run validates the synthetic MERGE
# tree rather than the commit that would actually land (#171 criterion 7a). The
# `pull_request` baseline resolver remains in `scripts/wave_gate.py` with full
# unit coverage; it is simply unreachable from CI. There is no
# `workflow_dispatch` either — dispatch is honoured only for workflows present
# on the default branch, and `main` carries no `.github/workflows`.
#
# There is deliberately NO `concurrency` block. Its `cancel-in-progress`
# expression was PR-only and is now dead, and a per-SHA group would make the
# SAME candidate SHA collide between its `scratch/**` preflight and the later
# `dev` push — exactly the sequence this workflow now creates. Every pushed ref
# that STARTS a run gets its own verdict — a head commit carrying `[skip ci]` starts
# none, so it gets no verdict at all (see the residual note above); the cost is more
# parallel runner minutes.
#
# Required-status disposition: since #172 this check IS required on `dev`, by a
# repository ruleset (`enforcement: active`, no bypass actors). The experiment
# spec §10 specified was run and both controls passed — an unchecked `[skip ci]`
# tip is refused, and a commit already green from a `scratch/**` preflight is
# accepted from another ref. Consequence for this workflow: the `scratch/**` arm
# below is no longer optional, because it is where a `dev` candidate earns the
# check the rule demands. A `[skip ci]` head commit still starts no run at all;
# on `dev` that now means the push is refused rather than landing unchecked.
#
# Runs the full non-KB suite on Python 3.11 — the interpreter production runs
# (`Dockerfile:5`, `python:3.11-slim`). Local development uses a 3.12 `.venv`;
# that skew is deliberate and this job is what stops it hiding a defect that
# only appears on the deployment interpreter. (It found seven on its first run.)
#
# Everything this job asserts lives in `scripts/wave_gate.py`, invoked once. The
# job deliberately does NOT run `pytest` itself: a workflow that shells out to
# pytest directly can go green on a partial collection, which is the exact
# failure mode this whole slice exists to make impossible. The gate asserts a
# committed floor and a committed set of required node ids before it believes
# any result.
#
# See `docs/architecture/ENDGAME_VERIFICATION_GATE.md`.
name: Python tests

on:
  push:
    branches: [dev, 'scratch/**']

permissions:
  contents: read

jobs:
  non-kb-python311:
    # This display name is the STABLE check name that #153 and #154 cite as
    # their "full non-KB Python 3.11 suite in CI" gate item. No ruleset depends
    # on it (see the header), but renaming it breaks those citations.
    name: Python 3.11 non-KB
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: "1"
      # Only what requirements-dev.txt installs may register a pytest plugin.
      # `anyio` ships a pytest11 entry point, but MEASURED: with autoload
      # disabled all 9,712 nodes still collect and the two modules that drive
      # async code (`anyio.run()`, a plain function — not the plugin's marker or
      # fixtures) pass 50/50. So the flag costs nothing here and closes the door
      # on a plugin arriving through a transitive dependency and changing what
      # this job runs.
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      # The credential-free configuration the plan specifies. Without
      # BOOMI_LOCAL a direct `import server` selects production initialization
      # and fails for a missing GCP_PROJECT_ID; the suite currently survives
      # only because some test module's import side effect happens to set local
      # mode first, which makes the required check ORDER-DEPENDENT.
      BOOMI_LOCAL: "true"
      BOOMI_DOCS_ENABLED: "false"
      BOOMI_GOTCHAS_ENABLED: "false"

    steps:
      # fetch-depth: 0 is REQUIRED, not tidiness. The scratch preflight resolves
      # `refs/remotes/origin/dev` and the gate then proves the candidate descends
      # from it, which needs the full remote ref set and complete ancestry — a
      # shallow checkout has neither. (The `pull_request` merge-base path that
      # originally motivated it is no longer triggered, but the requirement is
      # unchanged and stricter.)
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # ASSERT the version, do not print it. A `python --version` step that
      # reports 3.12 is a log line nobody reads; this is a failure.
      - name: Assert the interpreter is 3.11
        run: |
          python - <<'PY'
          import sys
          assert sys.version_info[:2] == (3, 11), sys.version
          print("interpreter ok:", sys.version)
          PY

      # requirements-dev.txt is the complete non-KB test environment. It does
      # NOT install requirements-kb.txt: the KB split is deliberate and
      # tests/kb/ does not run here.
      - name: Install the non-KB test environment
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      # The single gate. No `continue-on-error`, no `|| true`, no step-level
      # conditional: any non-zero exit fails the job, and an unrecognized context
      # REFUSES rather than skipping — two conditional steps could both skip and
      # leave a green job that checked nothing.
      - name: Wave gate (manifests, collection floor, required nodes, full suite)
        # GITHUB_SHA is the commit Actions checked out. The gate binds HEAD to it
        # for every `ci` context, so a step that edited the tree cannot pass its
        # own bytes off as the candidate. Passed explicitly so the binding does
        # not depend on ambient environment.
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          event="${GITHUB_EVENT_NAME-}"
          ref="${GITHUB_REF-}"

          case "${event}:${ref}" in
            push:refs/heads/dev)
              exec python scripts/wave_gate.py ci \
                --github-event "$GITHUB_EVENT_PATH"
              ;;
            push:refs/heads/scratch/*)
              if ! base="$(git rev-parse --verify \
                  'refs/remotes/origin/dev^{commit}' 2>/dev/null)"; then
                printf '%s\n' \
                  'BASELINE_UNAVAILABLE cannot resolve refs/remotes/origin/dev' >&2
                exit 2
              fi
              exec python scripts/wave_gate.py ci --base "$base"
              ;;
            *)
              printf 'BASELINE_EVENT_INVALID unsupported event/ref: %s %s\n' \
                "$event" "$ref" >&2
              exit 2
              ;;
          esac
