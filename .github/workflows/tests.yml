# The required status check for `dev`.
#
# Runs the full non-KB suite on Python 3.11 — the interpreter production runs
# (`Dockerfile:5`, `python:3.11-slim`). Local development uses a 3.12 `.venv`;
# that skew is deliberate and this job is what stops it hiding a defect that
# only appears on the deployment interpreter. (It found seven on its first run.)
#
# Everything this job asserts lives in `scripts/wave_gate.py`, invoked once. The
# job deliberately does NOT run `pytest` itself: a workflow that shells out to
# pytest directly can go green on a partial collection, which is the exact
# failure mode this whole slice exists to make impossible. The gate asserts a
# committed floor and a committed set of required node ids before it believes
# any result.
#
# See `docs/architecture/ENDGAME_VERIFICATION_GATE.md`.
name: Python tests

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read

concurrency:
  # Pushes get a group PER COMMIT, so they never queue against each other.
  #
  # `cancel-in-progress: false` is not enough on its own: GitHub cancels any
  # previously PENDING run in a group when a new run enters it, whatever that
  # flag says. With a shared per-ref group, three rapid pushes to `dev` leave
  # the middle commit cancelled with no verdict — on the branch whose protection
  # depends on this very check. A per-SHA group removes the queue entirely.
  #
  # PRs keep a shared per-ref group and DO cancel superseded runs: there the
  # only verdict that matters is the head commit's.
  group: >-
    ${{ github.workflow }}-${{ github.event_name == 'push'
        && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  non-kb-python311:
    # This display name is the STABLE required-check name configured in the
    # `dev` ruleset. Renaming it silently drops branch protection.
    name: Python 3.11 non-KB
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: "1"
      # Only what requirements-dev.txt installs may register a pytest plugin.
      # `anyio` ships a pytest11 entry point, but MEASURED: with autoload
      # disabled all 9,712 nodes still collect and the two modules that drive
      # async code (`anyio.run()`, a plain function — not the plugin's marker or
      # fixtures) pass 50/50. So the flag costs nothing here and closes the door
      # on a plugin arriving through a transitive dependency and changing what
      # this job runs.
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      # The credential-free configuration the plan specifies. Without
      # BOOMI_LOCAL a direct `import server` selects production initialization
      # and fails for a missing GCP_PROJECT_ID; the suite currently survives
      # only because some test module's import side effect happens to set local
      # mode first, which makes the required check ORDER-DEPENDENT.
      BOOMI_LOCAL: "true"
      BOOMI_DOCS_ENABLED: "false"
      BOOMI_GOTCHAS_ENABLED: "false"

    steps:
      # fetch-depth: 0 is REQUIRED, not tidiness: the gate resolves a PR's
      # baseline with `git merge-base`, and a shallow checkout has no merge base
      # — which the gate reports as BASELINE_MERGE_BASE_MISSING rather than
      # guessing.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # ASSERT the version, do not print it. A `python --version` step that
      # reports 3.12 is a log line nobody reads; this is a failure.
      - name: Assert the interpreter is 3.11
        run: |
          python - <<'PY'
          import sys
          assert sys.version_info[:2] == (3, 11), sys.version
          print("interpreter ok:", sys.version)
          PY

      # requirements-dev.txt is the complete non-KB test environment. It does
      # NOT install requirements-kb.txt: the KB split is deliberate and
      # tests/kb/ does not run here.
      - name: Install the non-KB test environment
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      # The single gate. No `continue-on-error`, no `|| true`, no conditional
      # skip: any non-zero exit fails the job.
      - name: Wave gate (manifests, collection floor, required nodes, full suite)
        # GITHUB_SHA is the commit Actions checked out — for a pull_request that
        # is the merge commit it built. The gate binds the tree under test to it,
        # because `pull_request.merge_commit_sha` in the payload is NULLABLE
        # (GitHub computes mergeability asynchronously). Passed explicitly so the
        # binding does not depend on ambient environment.
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: python scripts/wave_gate.py ci --github-event "$GITHUB_EVENT_PATH"
